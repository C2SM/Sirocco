[project]
# site_url = "https://iacweb.ethz.ch/staff/leclairm/sirocco"
site_url = "https://sirocco.ethz.ch"
repo_name = "C2SM/sirocco"
repo_url = "github.com/C2SM/Sirocco"

site_name = "Sirocco"
site_description = "A worflow tool for climate and weather aplications"
site_author = "Matthieu Leclair"

# copyright = "Copyright &copy; 2026 Your name"

# edit_uri = "edit/main/docs/"

nav = [
  { "About" = "index.md" },
  { "Configuration" = [
    "configuration/configuration.md",
    "configuration/cycles.md",
    "configuration/tasks.md",
    "configuration/data.md",
    "configuration/parameters.md",
  ]  },
  { "Task plugins" = [
    "plugins/index.md",
    {"Shell" = "plugins/shell.md"},
    {"ICON" = "plugins/icon.md"}
  ] },
  { "Orchestration" = "orchestration.md" },
  { "Usage" = ["usage/standalone.md", "usage/aiida.md"] },
  { "Glossary" = "glossary.md"},
  { "Dummy tests" = [
    "get_started/get_started.md",
    "get_started/markdown.md",
  ] },
]

extra_css = [
  "stylesheets/extra.css",
]
extra_javascript = [
  "javascripts/mathjax.js",
  # "javascripts/tex-mml-chtml.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
  "javascripts/image-scroll.js",
]

[project.theme]
# variant = "classic"
custom_dir = "docs/overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.navigation",
  "prefetch.instant.progress",
  # "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "assets/Sirocco_logo_no_name.svg"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
  media = "(prefers-color-scheme)"
  toggle.icon = "lucide/sun-moon"
  toggle.name = "Switch to light mode"
  scheme = "default"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true,
  title = "On this page",
  toc_depth = "2-6",
}
pymdownx.blocks.caption = {}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
  options.custom_icons = [
    "docs/overrides/.icons",
  ]
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets = {
#   base_path = "includes",
# }
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
