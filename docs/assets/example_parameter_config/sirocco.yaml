---
start_date: &root_start_date '2026-01-01T00:00'
stop_date: &root_stop_date '2026-05-01T00:00'
scheduler: slurm
cycles:
  - bi-monthly:
      cycling:
        start_date: *root_start_date
        stop_date: *root_stop_date
        period: "P2M"
      tasks:
        - pre proc:
            inputs:
              raw_input: [raw input data]
            outputs:
              processed: [boundary conditions]
            wait_on:
              - model:
                  when:
                    after: "2026-03-01T00:00"
                  target_cycle:
                    lag: "-P4M"
        - model:
            inputs:
              init:
                - initial conditions:
                    when:
                      at: *root_start_date
              bc: [boundary conditions]
              restart_in:
                - restart_file:
                    when:
                      after: *root_start_date
                    target_cycle:
                      lag: "-P2M"
                    parameters:
                      foo: single
                      bar: single
            outputs:
              output_streams: [stream 1]
              restart_out: [restart_file]
        - post proc:
            inputs:
              in:
                - stream 1:
                    parameters:
                      foo: single
                      bar: single
            outputs:
              out: [processed]
        - statistics foo:
            inputs:
              in:
                - processed:
                    parameters:
                      foo: all
                      bar: single
            outputs:
              out: [stat foo]
        - statistics bar:
            inputs:
              in:
                - stat foo:
                    parameters:
                      bar: all
            outputs:
              out: [stat bar]

tasks:
  - ROOT:
      computer: bla
  - pre proc:
      plugin: shell
      command: "bla"
  - model:
      plugin: shell
      command: "bla"
      parameters: [foo, bar]
  - post proc:
      plugin: shell
      command: "bla"
      parameters: [foo, bar]
  - statistics foo:
      plugin: shell
      command: "bla"
      parameters: [bar]
  - statistics bar:
      plugin: shell
      command: "bla"
data:
  available:
     - raw input data:
         path: "/path/to/raw_input_data"
     - initial conditions:
         path: "/path/to/initial_conditions"
  generated:
     - boundary conditions: {}
     - stream 1:
         parameters: [foo, bar]
     - restart_file:
         parameters: [foo, bar]
     - processed:
         parameters: [foo, bar]
     - stat foo:
         parameters: [bar]
     - stat bar: {}

parameters:
  foo: [0, 1, 2]
  bar: [1.5, 2.9]
