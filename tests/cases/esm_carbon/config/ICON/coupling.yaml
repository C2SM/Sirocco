predef:
  interp_stacks:
    nnn_fixed: &nnn_fixed
      interpolation:
        - nnn: 
            n: 1
            weighted: arithmetic_average
        - fixed:
            user_value: -999.9
    source2target: &source2target
      interpolation:
        - source_to_target_map
  time_config: &time_config
    coupling_period: PT12M
    time_reduction: average
  component_configs:
    atm2ocn: &atm2ocn
      src_component: atmo
      src_grid: icon_atmos_grid
      src_lag: 1
      tgt_component: ocean
      tgt_grid: icon_ocean_grid
      tgt_lag: 1
      <<: [ *time_config ]
    ocn2atm: &ocn2atm
      src_component: ocean
      src_grid: icon_ocean_grid
      src_lag: 1
      tgt_component: atmo
      tgt_grid: icon_atmos_grid
      tgt_lag: 1
      <<: [ *time_config ]

timestep_unit: ISO_format
calendar: proleptic-gregorian
coupling:
# ATM -> OCN
  - <<: [ *atm2ocn, *nnn_fixed ]
    field: [co2_mixing_ratio, surface_downward_eastward_stress, surface_downward_northward_stress]
  - <<: [ *atm2ocn, *nnn_fixed ]
    field: [surface_fresh_water_flux, total_heat_flux, atmosphere_sea_ice_bundle, 10m_wind_speed]
  - <<: [ *atm2ocn, *source2target ]
    field: [river_runoff]
# OCN -> ATM
  - <<: [ *ocn2atm, *nnn_fixed ]
    field:
      - sea_surface_temperature
      - surface_velocity_bundle
      - ocean_sea_ice_bundle
      - co2_flux
